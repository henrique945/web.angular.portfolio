<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">ControleAki production architecture</title>
  <desc id="desc">The landing page, Angular backoffice and Ionic customer application connect to a tenant-aware NestJS API on AWS Lambda, backed by PostgreSQL and integrations with Asaas, Amazon S3, Amazon SES and Sentry.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12z" fill="#D3793D"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#1A2A34" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1440" height="810" fill="#F2F7F8"/>
  <text x="96" y="92" fill="#1A2A34" font-family="Arial, sans-serif" font-size="38" font-weight="700">A tenant-aware SaaS from storefront to operations</text>
  <text x="96" y="132" fill="#5C6C74" font-family="Arial, sans-serif" font-size="20">Four product surfaces, one API boundary and explicit integrations.</text>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="88" y="210" width="270" height="108" rx="14" fill="#FFFFFF" stroke="#CAD5D8"/>
    <text x="120" y="254" fill="#375C66" font-size="16" font-weight="700" letter-spacing="1">PUBLIC</text>
    <text x="120" y="288" fill="#1A2A34" font-size="25" font-weight="700">Landing page</text>

    <rect x="88" y="352" width="270" height="108" rx="14" fill="#FFFFFF" stroke="#CAD5D8"/>
    <text x="120" y="396" fill="#375C66" font-size="16" font-weight="700" letter-spacing="1">OPERATIONS</text>
    <text x="120" y="430" fill="#1A2A34" font-size="25" font-weight="700">Angular backoffice</text>

    <rect x="88" y="494" width="270" height="108" rx="14" fill="#FFFFFF" stroke="#CAD5D8"/>
    <text x="120" y="538" fill="#375C66" font-size="16" font-weight="700" letter-spacing="1">CUSTOMER</text>
    <text x="120" y="572" fill="#1A2A34" font-size="25" font-weight="700">Ionic / Angular PWA</text>

    <rect x="506" y="320" width="344" height="184" rx="18" fill="#1A2A34" stroke="#1A2A34"/>
    <text x="548" y="370" fill="#D3793D" font-size="17" font-weight="700" letter-spacing="1">APPLICATION BOUNDARY</text>
    <text x="548" y="414" fill="#E7F0F2" font-size="30" font-weight="700">NestJS API</text>
    <text x="548" y="450" fill="#AFBEC4" font-size="20">AWS Lambda · tenant middleware</text>
    <text x="548" y="480" fill="#AFBEC4" font-size="20">JWT roles · validation · rate limits</text>

    <rect x="1000" y="198" width="318" height="108" rx="14" fill="#FFFFFF" stroke="#CAD5D8"/>
    <text x="1032" y="240" fill="#375C66" font-size="16" font-weight="700" letter-spacing="1">DATA</text>
    <text x="1032" y="276" fill="#1A2A34" font-size="25" font-weight="700">PostgreSQL</text>

    <rect x="1000" y="330" width="318" height="108" rx="14" fill="#FFFFFF" stroke="#CAD5D8"/>
    <text x="1032" y="372" fill="#375C66" font-size="16" font-weight="700" letter-spacing="1">BILLING</text>
    <text x="1032" y="408" fill="#1A2A34" font-size="25" font-weight="700">Asaas webhooks</text>

    <rect x="1000" y="462" width="318" height="108" rx="14" fill="#FFFFFF" stroke="#CAD5D8"/>
    <text x="1032" y="504" fill="#375C66" font-size="16" font-weight="700" letter-spacing="1">PLATFORM SERVICES</text>
    <text x="1032" y="540" fill="#1A2A34" font-size="25" font-weight="700">Amazon S3 + SES</text>

    <rect x="1000" y="594" width="318" height="108" rx="14" fill="#FFFFFF" stroke="#CAD5D8"/>
    <text x="1032" y="636" fill="#375C66" font-size="16" font-weight="700" letter-spacing="1">OBSERVABILITY</text>
    <text x="1032" y="672" fill="#1A2A34" font-size="25" font-weight="700">Sentry + CloudWatch</text>
  </g>

  <g fill="none" stroke="#D3793D" stroke-width="4" marker-end="url(#arrow)">
    <path d="M358 264 C430 264 438 354 506 376"/>
    <path d="M358 406 H506"/>
    <path d="M358 548 C430 548 438 470 506 448"/>
    <path d="M850 376 C914 356 932 276 1000 254"/>
    <path d="M850 406 H1000"/>
    <path d="M850 438 C914 454 936 506 1000 516"/>
    <path d="M850 466 C920 500 930 622 1000 644"/>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="506" y="584" width="344" height="98" rx="14" fill="#EAF2F3" stroke="#A0AEB2"/>
    <text x="538" y="622" fill="#375C66" font-size="16" font-weight="700" letter-spacing="1">TENANT ISOLATION</text>
    <text x="538" y="656" fill="#1A2A34" font-size="20">Per-restaurant UUID + subdomain routing</text>
  </g>
</svg>
